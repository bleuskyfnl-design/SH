name: SapphicHeaven Reposter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapphicheaven-reposter
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto

      - name: Run SapphicHeaven reposter
        env:
          BSKY_USERNAME: sapphicheaven.bsky.social
          SAPPHICHEAVEN_PASSWORD: ${{ secrets.SAPPHICHEAVEN_PASSWORD }}
        run: python sapphicheaven_reposter.py
